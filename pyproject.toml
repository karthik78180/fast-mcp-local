[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-mcp-local"
version = "0.1.0"
description = "PRB SRE Assistant - AI-powered Problem Record management for SRE teams"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.1.0",
    "tiktoken>=0.5.0",
    "click>=8.0.0",
]

[project.scripts]
prb = "fast_mcp_local.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
